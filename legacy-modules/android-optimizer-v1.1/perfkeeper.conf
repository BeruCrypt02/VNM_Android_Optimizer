# HyperOS Perfkeeper — performance toggles
# Edited by the WebUI "Performance" tab, or by hand. Values applied
# immediately when changed from the WebUI, and re-applied every boot
# + every maintenance cycle by scripts/apply_perf.sh
IO_SCHEDULER_ENABLE=1
IO_SCHEDULER=deadline
SWAPPINESS_ENABLE=1
SWAPPINESS=10
DIRTY_RATIO_ENABLE=1
DIRTY_RATIO=15
DIRTY_BG_RATIO=5
F2FS_GC_ENABLE=1
FSTRIM_ENABLE=1

# DB_VACUUM: only touches a database if PRAGMA quick_check passes first
# (skips anything not perfectly healthy instead of risking a lock/corrupt
# db). Runs at most once every DB_VACUUM_INTERVAL_DAYS, and only while the
# screen is off, so it never fights a live app (contacts/gallery) for the db.
DB_VACUUM_ENABLE=1
DB_VACUUM_INTERVAL_DAYS=7
DB_VACUUM_IDLE_ONLY=1

JUNK_CLEAN_ENABLE=1
