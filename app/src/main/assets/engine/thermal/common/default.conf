# MkVenomPro Optimizer configuration
# 1 = ON, 0 = OFF. Numeric values can be typed manually (0 = off / don't change).
# Sub-values set to 0 = keep the stock value.
# Every change is applied ONCE at the next boot. Nothing runs in the background except the two opt-in keepers (charge limit, daily cache clean).
cfg_ver=3

# ---------- Heat control (kernel) ----------
# cpu_cap = % of max clock for big/prime clusters (40-99, 0 = off)
cpu_cap=95
# cpu_cap_lock: make scaling_max_freq read-only after the cap so ROM boosters cannot raise it (1 = on)
cpu_cap_lock=1
prime_park=0
# gpu_cap = number of top GPU power levels removed (1-4, never more than half; 0 = off)
gpu_cap=0
gpu_idle=1
gpu_idle_timer=64
walt_tune=1
walt_hispeed_load=95
walt_up_rate=1000
walt_sched_boost_off=1
input_boost_off=0
bg_cpuset=1
bg_uclamp=30
blur_off=0
# charge_cool = charge current limit in mA (500-12000, 0 = off)
charge_cool=0
# charge_cool_level: exact charger level 1-15 (0 = pick from the mA value above)
charge_cool_level=0
# charge_limit: Xiaomi night_charging flag, stops charging near 80%
charge_limit=0

# ---------- Battery drain (kernel) ----------
cpu_idle=1
ufs_pm=1
vm_tune=1
vm_writeback=3000
vm_stat_interval=10
vm_dirty_bg=10
vm_dirty=30
io_tune=1
debug_off=1
debug_props=1
wakelock_block=0
# only scan-related wakelocks: nothing on the notification / push path
wl_list=wlan_pno_wl;wlan_extscan_wl;wcnss_filter_lock

# ---------- Protected apps (never restricted, kept alive in Doze) ----------
protect_apps=1
protect_pkgs=com.whatsapp,com.whatsapp.w4b,org.telegram.messenger,org.telegram.plus,com.facebook.orca,jp.naver.line.android,com.discord,com.google.android.gm
# app_bucket: 0 off, 1 rare, 2 restricted (non-protected user apps)
app_bucket=0
# bg_block: picked apps get no background execution (empty list = nothing happens)
bg_block=1
bg_block_pkgs=

# ---------- Battery drain (system / ROM) ----------
app_freezer=1
# doze_aggr: 0 off, 1 moderate, 2 aggressive, 3 maximum, 4 custom (doze_custom)
doze_aggr=2
doze_custom=light_after_inactive_to=15000,light_pre_idle_to=30000,light_idle_to=900000,light_max_idle_to=1800000,inactive_to=60000,sensing_to=0,locating_to=0,motion_inactive_to=0,idle_after_inactive_to=0,idle_pending_to=60000,quick_doze_delay_to=15000,idle_to=3600000,max_idle_to=21600000
devcfg_lock=0
gms_doze=0
scan_off=1
net_save=1
standby=1
stats_reduce=1
tracking_off=1
debloat=1
debloat_pkgs=com.miui.analytics,com.miui.daemon,com.miui.bugreport,com.miui.msa.global,com.miui.systemAdSolution
joyose_off=0
log_reduce=1

# ---------- Long battery / saver ----------
# saver_policy: 0 off, 1 balanced, 2 extreme, 3 custom (saver_constants)
saver_policy=1
saver_constants=advertise_is_enabled=true,enable_datasaver=false,disable_launch_boost=true,disable_vibration=true,disable_animation=false,soundtrigger_mode=1,defer_full_backup=true,defer_keyvalue_backup=true,enable_firewall=true,location_mode=3,enable_brightness_adjustment=false,force_all_apps_standby=true,force_background_check=true,disable_optional_sensors=true,disable_aod=true,enable_quick_doze=true,enable_night_mode=true
# saver_trigger: auto Battery Saver % (5-95, 0 = don't change)
saver_trigger=0
# refresh_rate: peak Hz (30-165, 0 = don't change)
refresh_rate=0
# anim_scale: % of normal speed (10-100, 0 = don't change)
anim_scale=0

# ---------- Advanced ----------
# apply_delay: seconds after boot (10-120)
apply_delay=30

# ---------- More (merged extras; safe ones ON by default, see each key) ----------
# Extra kernel tuning
x_sched=0
x_kquiet=1
x_net=1
x_io=0
x_xiaomi_fw=1
# RAM management - x_ram_level: 1 moderate, 2 maximum
# x_multitask: 0 off, 1 balanced, 2 performance, 3 powersaving
x_ram_opt=0
x_ram_level=1
x_multitask=0
# Google services & telemetry
x_gms_freeze=0
x_track=1
# Logging & diagnostics
x_log_nuke=0
x_diag=1
x_props=1
# Extra power saving (kernel, applied at boot; stock again after reboot when off)
x_kpower=1
x_vm_lite=0
# Storage: daily app-cache clean (keeper); x_cache_min = optional minimum MB (0 = always clean)
x_cache_auto=1
x_cache_min=0
