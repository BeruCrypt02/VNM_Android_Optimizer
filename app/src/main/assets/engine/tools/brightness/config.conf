# Spinel Brightness Controller v3.0 - edit, then reboot

# Highest backlight value (capped by max_brightness, 4095 on spinel)
MAX=4095

# Slider position (0..1) where the lift starts. Below it = stock brightness, untouched.
# Lower = the whole slider gets brighter, higher = only the top end.
PK=0.30

# Curve shape from PK to the top. 1.0 = linear in perceived steps, 2.0 = gentle start / strong end,
# 3.0 = even gentler start.
SHAPE=2.0

# Time for a full-range change in ms (bigger = softer)
RAMP_MS=250

# Framework float at slider min / max (from your dumpsys: brightnessMinimum / hbmMax)
XMIN=0.001709819
XMAX=0.66597474

# 1 = the HAL's writes are redirected and this module is the only writer (no flicker).
# Falls back to rewrite mode automatically if that does not work. 0 = always rewrite mode.
EXCLUSIVE=1

# Thermal derate (board_sensor_temp, deg C : max backlight). "off" disables.
# 37C+ -> 3200, 39C+ -> 2400, 41C+ -> 1700, 43C+ -> 1200, 46C+ -> 800
DERATE=37:3200,39:2400,41:1700,43:1200,46:800

TICK_MS=3
